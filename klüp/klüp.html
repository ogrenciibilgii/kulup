<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kulüp Kayıt Formu</title>
  <link rel="stylesheet" href="klüp.css">
</head>

<body>
  <div class="container">
    <h1>Kulüp Kayıt Formu</h1>
    <p>Lütfen bilgilerinizi doldurun</p>

    <form id="kulupForm">
      <div class="form-group">
        <label for="ogrNo">Öğrenci No</label>
        <input type="text" id="ogrNo" name="ogrNo" required>
      </div>

      <div class="form-group">
        <label for="adSoyad">Ad Soyad</label>
        <input type="text" id="adSoyad" name="adSoyad" required>
      </div>

      <div class="form-group">
        <label>Kulüp Seçimi</label>
        <label><input type="radio" name="kulup" value="Afet Farkındalığı Kulübü"> <span class="club-text">Afet
            Farkındalığı Kulübü</span></label>
        <label><input type="radio" name="kulup" value="Kızılay Kulübü"> <span class="club-text">Kızılay
            Kulübü</span></label>
        <label><input type="radio" name="kulup" value="Yeşilay Kulübü"> <span class="club-text">Yeşilay
            Kulübü</span></label>
        <label><input type="radio" name="kulup" value="Beyazay Kulübü"> <span class="club-text">Beyazay
            Kulübü</span></label>
        <label><input type="radio" name="kulup" value="Siberay Kulübü"> <span class="club-text">Siberay
            Kulübü</span></label>
        <label><input type="radio" name="kulup" value="Tarih ve Kültürel Miras Kulübü"> <span class="club-text">Tarih ve
            Kültürel Miras Kulübü</span></label>
        <label><input type="radio" name="kulup" value="Tabiat ve Yaşanabilir Çevre Kulübü"> <span
            class="club-text">Tabiat ve Yaşanabilir Çevre Kulübü</span></label>
        <label><input type="radio" name="kulup" value="Sağlıklı Yaşam ve Fiziksel Aktivite Kulübü"> <span
            class="club-text">Sağlıklı Yaşam ve Fiziksel Aktivite Kulübü</span></label>
        <label><input type="radio" name="kulup" value="Yaşam Becerileri Kulübü"> <span class="club-text">Yaşam
            Becerileri Kulübü</span></label>
        <label><input type="radio" name="kulup" value="Kültür ve Yayıncılık Kulübü"> <span class="club-text">Kültür ve
            Yayıncılık Kulübü</span></label>
        <label><input type="radio" name="kulup" value="Sahne Sanatları Kulübü"> <span class="club-text">Sahne Sanatları
            Kulübü</span></label>
        <label><input type="radio" name="kulup" value="Havacılık ve Uzay Kulübü"> <span class="club-text">Havacılık ve
            Uzay Kulübü</span></label>
        <label><input type="radio" name="kulup" value="Edebiyat ve Yazarlık Kulübü"> <span class="club-text">Edebiyat ve
            Yazarlık Kulübü</span></label>
        <label><input type="radio" name="kulup" value="Akıl ve Zekâ Oyunları Kulübü"> <span class="club-text">Akıl ve
            Zekâ Oyunları Kulübü</span></label>
        <label><input type="radio" name="kulup" value="Dijital Beceriler Kulübü"> <span class="club-text">Dijital
            Beceriler Kulübü</span></label>
        <label><input type="radio" name="kulup" value="ÇEDES Değerler Kulübü"> <span class="club-text">ÇEDES Değerler
            Kulübü</span></label>
        <label><input type="radio" name="kulup" value="Genç Arge Kulübü"> <span class="club-text">Genç Arge
            Kulübü</span></label>
      </div>

      <button type="submit">Onayla</button>
    </form>

    <div id="sonuc"></div>
  </div>

  <script>
    const FORM_ACTION_URL = "https://script.google.com/macros/s/AKfycbwbiL8mFZnip0cp63-mzk3h_kUgosfMqyrunB6xJj1d3XZRmrP5PJUxxzvP6FQZnvpw/exec"; // kendi URL'ni yaz

    const form = document.getElementById("kulupForm");
    const sonuc = document.getElementById("sonuc");
    const kontenjan = 2; // Her kulüp için maksimum kontenjan

    // Sayfa yüklendiğinde kontenjan bilgilerini al ve göster
    window.addEventListener("DOMContentLoaded", () => {
      fetch(FORM_ACTION_URL)
        .then(res => res.json())
        .then(data => {
          console.log("Kulüp doluluk durumu:", data);
          updateKontenjanDisplay(data);
        })
        .catch(err => {
          console.error("Kulüp verileri alınamadı:", err);
        });
    });

    // Kontenjan bilgilerini güncelle
    function updateKontenjanDisplay(data) {
      const radios = document.querySelectorAll('input[name="kulup"]');

      radios.forEach(radio => {
        const clubName = radio.value;
        const kayitliSayisi = data[clubName] || 0;
        const kalan = kontenjan - kayitliSayisi;
        const clubTextSpan = radio.parentElement.querySelector('.club-text');

        if (kayitliSayisi >= kontenjan) {
          // Kulüp dolu
          radio.disabled = true;
          radio.parentElement.classList.add("disabled-label");
          clubTextSpan.innerHTML = clubName + ' <span class="dolu">(DOLU)</span>';
        } else {
          // Kontenjan var
          clubTextSpan.innerHTML = clubName + ' <span class="kontenjan">(' + kalan + ')</span>';
        }
      });
    }

    // Form gönderimi
    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const formData = new FormData(form);
      const ogrNo = formData.get("ogrNo");
      const adSoyad = formData.get("adSoyad");
      const kulup = formData.get("kulup");

      if (!kulup) {
        sonuc.innerHTML = "<p class='fail'>❗Lütfen bir kulüp seçiniz.</p>";
        return;
      }

      sonuc.textContent = "Gönderiliyor...";

      const data = new FormData();
      data.append("ogrNo", ogrNo);
      data.append("adSoyad", adSoyad);
      data.append("kulup", kulup);

      fetch(FORM_ACTION_URL, { method: "POST", body: data })
        .then(res => res.json())
        .then(result => {
          if (result.result === "success") {
            sonuc.innerHTML = "<span class='ok'>✔ Kayıt başarılı. Katıldığınız kulüp: " + kulup + "</span>";
            form.reset();
            // Kontenjan bilgilerini yeniden yükle
            setTimeout(() => {
              fetch(FORM_ACTION_URL)
                .then(res => res.json())
                .then(data => updateKontenjanDisplay(data))
                .catch(err => console.error("Kontenjan güncellenirken hata:", err));
            }, 1000);
          } else if (result.result === "fail" && result.message === "Kontenjan dolu") {
            sonuc.innerHTML = "<span class='fail'>❗ Seçtiğiniz kulübün kontenjanı dolmuş.</span>";
          } else if (result.result === "fail" && result.message === "Bu öğrenci zaten kayıt olmuş.") {
            sonuc.innerHTML = "<span class='fail'>❗ Bu öğrenci numarası ile zaten kayıt yapılmış.</span>";
          } else {
            sonuc.innerHTML = "<span class='fail'>Bir hata oluştu: " + (result.message || "Bilinmeyen hata") + "</span>";
          }
        })
        .catch(err => {
          sonuc.innerHTML = "<span class='fail'>Sunucu hatası: " + err.message + "</span>";
        });
    });
  </script>
</body>

</html>
